<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Poke Idle World — Bot Control Panel</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #00d2ff;
      --accent-green: #00ff88;
      --accent-yellow: #f59e0b;
      --accent-red: #ff3366;
      --accent-purple: #a855f7;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-card .val { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    .acc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .acc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .acc-title { font-size: 1.15rem; font-weight: bold; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
    }
    .badge-hunting { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-idle { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
    .badge-error { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .bar-wrap { margin-bottom: 12px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
    .progress {
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-inner { height: 100%; transition: width 0.3s; }
    .hp-bar { background: linear-gradient(90deg, #ff3366, #ff6b8b); }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.85rem;
      background: #0d131f;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: #1f2937;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover { background: #374151; border-color: #4b5563; }
    .btn-primary { background: #0284c7; border-color: #0284c7; }
    .btn-primary:hover { background: #0369a1; }
    .btn-green { background: #059669; border-color: #059669; }
    .btn-green:hover { background: #047857; }
    .btn-purple { background: #7c3aed; border-color: #7c3aed; }
    .btn-purple:hover { background: #6d28d9; }
    .logs-box {
      margin-top: 14px;
      background: #000;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.72rem;
      max-height: 90px;
      overflow-y: auto;
      color: #94a3b8;
      border: 1px solid #1f2937;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ POKE IDLE WORLD — COMMAND CENTER</h1>
    <span id="uptimeBadge" style="font-size: 0.85rem; color: var(--text-muted);">Uptime: ...</span>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="label">Contas Ativas</div>
      <div class="val" id="totalActive">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Ouro Acumulado</div>
      <div class="val" id="totalGold" style="color: #ffaa00;">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Monstros Derrotados</div>
      <div class="val" id="totalKills" style="color: var(--accent-green);">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Pokémons Capturados</div>
      <div class="val" id="totalCaptures" style="color: var(--accent-purple);">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Memória RAM</div>
      <div class="val" id="ramStats" style="color: var(--accent);">0 MB</div>
    </div>
  </div>

  <div class="grid" id="accountsGrid"></div>

  <script>
    async function refresh() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        document.getElementById('uptimeBadge').textContent = 'Uptime: ' + data.uptime;
        document.getElementById('ramStats').textContent = data.ramAllocMB.toFixed(1) + ' MB (Sys: ' + data.ramSysMB.toFixed(1) + ' MB)';
        
        const accounts = data.accounts || [];
        let totalGold = 0;
        let totalKills = 0;
        let totalCaps = 0;
        let activeCount = 0;

        const grid = document.getElementById('accountsGrid');
        grid.innerHTML = '';

        accounts.forEach(acc => {
          totalGold += acc.gold || 0;
          totalKills += acc.kills || 0;
          const caps = (acc.extra && acc.extra.captures) ? Number(acc.extra.captures) : 0;
          const balls = (acc.extra && acc.extra.balls !== undefined) ? Number(acc.extra.balls) : 0;
          const pokeName = (acc.extra && acc.extra.activePokemon) ? acc.extra.activePokemon : '';
          const pokeTypes = (acc.extra && acc.extra.pokemonTypes) ? acc.extra.pokemonTypes : '';
          const matchup = (acc.extra && acc.extra.matchup) ? acc.extra.matchup : '';
          const matchupDetail = (acc.extra && acc.extra.matchupDetail) ? acc.extra.matchupDetail : '';
          const isAutoWeakness = !!(acc.extra && acc.extra.autoWeakness);
          const guildName = (acc.extra && acc.extra.guildName) ? acc.extra.guildName : '';
          const guildTag = (acc.extra && acc.extra.guildTag) ? acc.extra.guildTag : '';
          const guildBonus = (acc.extra && acc.extra.guildBonus) ? acc.extra.guildBonus : '+0.0% XP';
          const guildMembers = (acc.extra && acc.extra.guildMembers) ? acc.extra.guildMembers : '';
          const hasGuild = guildName && guildName !== 'Nenhuma';
          totalCaps += caps;

          if (acc.status === 'hunting') activeCount++;

          const hpPct = acc.maxHp > 0 ? Math.min(100, Math.round((acc.hp / acc.maxHp) * 100)) : 0;

          let badgeClass = 'badge-idle';
          if (acc.status === 'hunting') badgeClass = 'badge-hunting';
          if (acc.status.includes('Erro') || acc.status.includes('offline') || acc.status.includes('Sem credenciais')) badgeClass = 'badge-error';

          const card = document.createElement('div');
          card.className = 'acc-card';
          card.innerHTML = `
            <div class="acc-header">
              <div>
                <span class="acc-title">${acc.name || acc.id}</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 6px;">Lv. ${acc.level || 1}</span>
              </div>
              <span class="badge ${badgeClass}">${acc.status}</span>
            </div>

            ${pokeName ? `
            <div style="background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center;">
              <div><strong>🐾 Equipe:</strong> ${pokeName} <span style="color: var(--accent-green); font-weight: 600;">[${pokeTypes}]</span></div>
              <span class="badge" style="background: #059669; color: #fff; font-size: 0.72rem;">${matchup || 'Matchup'}</span>
            </div>
            ` : ''}

            <div style="background: ${hasGuild ? 'rgba(168, 85, 247, 0.12)' : 'rgba(107, 114, 128, 0.12)'}; border: 1px solid ${hasGuild ? 'rgba(168, 85, 247, 0.35)' : 'rgba(107, 114, 128, 0.25)'}; border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center;">
              <div><strong>🏰 Guilda:</strong> ${hasGuild ? `<span style="color: #c084fc; font-weight: 600;">[${guildTag}] ${guildName}</span> <span style="font-size:0.75rem; color:var(--text-muted);">(${guildMembers})</span>` : '<span style="color: var(--text-muted);">Sem Guilda (Auto-recrutando)</span>'}</div>
              <span class="badge" style="background: ${hasGuild ? '#7c3aed' : '#374151'}; color: #fff; font-size: 0.72rem;">${guildBonus}</span>
            </div>

            <div class="bar-wrap">
              <div class="bar-label"><span>HP da Equipe</span><span>${acc.hp}/${acc.maxHp} (${hpPct}%)</span></div>
              <div class="progress"><div class="progress-inner hp-bar" style="width: ${hpPct}%"></div></div>
            </div>

            <div class="info-grid">
              <div><strong>Ouro:</strong> ${(acc.gold || 0).toLocaleString()}</div>
              <div><strong>Kills:</strong> ${(acc.kills || 0).toLocaleString()}</div>
              <div><strong>Capturas:</strong> ${caps.toLocaleString()}</div>
              <div><strong>Pokébolas:</strong> ${balls.toLocaleString()}</div>
              <div><strong>Área:</strong> ${acc.currentArea || 'Nenhuma'}</div>
              <div><strong>EXP/h:</strong> ${Math.round(acc.expPerHour || 0).toLocaleString()}</div>
              <div style="grid-column: span 2; font-size: 0.76rem; color: #38bdf8;"><strong>Fraqueza:</strong> ${matchupDetail || 'Calculando vantagem de tipo...'}</div>
            </div>

            <div class="actions-grid">
              <button class="btn btn-primary" onclick="dispatchAction('${acc.id}', 'autoHunt')">⚔️ Toggle Hunt</button>
              <button class="btn btn-green" onclick="dispatchAction('${acc.id}', 'joyHeal')">💖 Nurse Joy (Curar)</button>
              <button class="btn" style="${isAutoWeakness ? 'background:#059669; border-color:#059669;' : ''}" onclick="dispatchAction('${acc.id}', 'toggleWeakness')">🎯 Auto-Fraqueza (${isAutoWeakness ? 'ON' : 'OFF'})</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'autoCatch')">🔴 Auto-Catch</button>
              <button class="btn" onclick="promptSetArea('${acc.id}')">🗺️ Mudar Rota</button>
              <button class="btn" onclick="promptBuyBalls('${acc.id}')">🛒 Comprar Pokébolas</button>
              <button class="btn btn-purple" onclick="dispatchAction('${acc.id}', 'guildRecruit')">📢 Buscar Guilda (Chat)</button>
              <button class="btn" onclick="dispatchAction('${acc.id}', 'guildGet')">🏰 Atualizar Guilda</button>
              <button class="btn" onclick="promptSendChat('${acc.id}')">💬 Enviar Chat</button>
              ${hasGuild ? `<button class="btn" onclick="promptGuildDonate('${acc.id}')">💰 Doar Guilda</button>` : ''}
              <button class="btn" onclick="dispatchAction('${acc.id}', 'claimDaily')">🎁 Coletar Diário</button>
              <button class="btn btn-purple" onclick="promptSupplyTicket('${acc.id}')">🔑 Injetar Token</button>
            </div>

            <div class="logs-box">
              ${(acc.logs || []).slice(-5).map(l => '<div>▸ ' + l + '</div>').join('') || '<div>Nenhum log registrado</div>'}
            </div>
          `;
          grid.appendChild(card);
        });

        document.getElementById('totalActive').textContent = activeCount + '/' + accounts.length;
        document.getElementById('totalGold').textContent = totalGold.toLocaleString();
        document.getElementById('totalKills').textContent = totalKills.toLocaleString();
        document.getElementById('totalCaptures').textContent = totalCaps.toLocaleString();

      } catch (e) {
        console.error('Falha ao atualizar dashboard:', e);
      }
    }

    async function dispatchAction(accId, action, payload = {}) {
      try {
        const res = await fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountId: accId, action: action, payload: payload })
        });
        const data = await res.json();
        if (data.ok) {
          refresh();
        } else {
          alert('Erro: ' + data.error);
        }
      } catch (e) {
        alert('Erro ao enviar ação: ' + e);
      }
    }

    function promptSetArea(accId) {
      const area = prompt('Informe o slug da nova área de caça (ou digite "auto" para buscar por fraqueza):');
      if (area) {
        dispatchAction(accId, 'setArea', { slug: area.trim().toLowerCase() });
      }
    }

    function promptBuyBalls(accId) {
      const qtyStr = prompt('Quantidade de Pokébolas para comprar:', '50');
      if (qtyStr) {
        const qty = parseInt(qtyStr, 10);
        if (qty > 0) {
          dispatchAction(accId, 'buyBalls', { qty: qty, ballId: 1 });
        }
      }
    }

    function promptSupplyTicket(accId) {
      const token = prompt('Cole aqui seu Access Token JWT do Poke Idle World (obtido no console do navegador):');
      if (token) {
        dispatchAction(accId, 'supplyTicket', { token: token.trim() });
      }
    }

    function promptSendChat(accId) {
      const msg = prompt('Digite a mensagem a ser enviada no chat (canal help):');
      if (msg) {
        dispatchAction(accId, 'sendChat', { message: msg.trim(), channel: 'help' });
      }
    }

    function promptGuildDonate(accId) {
      const amtStr = prompt('Quantidade de ouro para doar à guilda:', '5000');
      if (amtStr) {
        const amt = parseInt(amtStr, 10);
        if (amt > 0) {
          dispatchAction(accId, 'guildDonate', { amount: amt });
        }
      }
    }

    setInterval(refresh, 2500);
    refresh();
  </script>
</body>
</html>
